<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurzbewerbung – Tag des Berufs</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  padding: 12px;
}

.wrap {
  max-width: 1100px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #332f87;
}

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.panel, .preview {
  background: white;
  border-radius: 20px;
  padding: 16px;
  border: 1px solid #ddd;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #332f87;
  color: white;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
}

/* LOGO */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

/* FOTO */
.avatar {
  width: 80px;
  height: 80px;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid #ddd;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: none;
}

/* TEXT */
.name {
  font-size: 22px;
  font-weight: bold;
  color: #332f87;
}

.meta {
  font-size: 14px;
  color: #555;
}

.chip {
  display: inline-block;
  background: #eef2f8;
  padding: 6px 10px;
  border-radius: 20px;
  margin: 5px 5px 0 0;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>Kurzbewerbung – Tag des Berufs</h1>

<div class="grid">

<!-- FORMULAR -->
<div class="panel">

<label>Dein Name</label>
<input id="name">

<label>Deine Schule</label>
<select id="school">
<option value="">Bitte auswählen</option>
<option>Friedrich-List-Schule</option>
<option>Emil-Possehl-Schule</option>
</select>

<label>Abschluss (voraussichtlich)</label>
<input id="abschluss">

<label>Wann machst du deinen Abschluss?</label>
<input id="abschlussWann">

<label>Kontakt</label>
<input id="contact">

<label>Ich suche</label>
<select id="interest">
<option value="">Bitte auswählen</option>
<option>Praktikum</option>
<option>Ausbildung</option>
<option>Duales Studium</option>
</select>

<label>Ab wann / Zeitraum</label>
<input id="timeframe">

<label>Beruf oder Bereich</label>
<input id="career">

<label>Foto (optional)</label>
<input id="photo" type="file">

<button onclick="saveCard()">Karte speichern / teilen</button>

</div>

<!-- VORSCHAU -->
<div class="preview" id="card">

<div class="brand">
<img src="logo.png" class="brand-logo">
<div>Tag des Berufs</div>
</div>

<p id="intro">Hallo, ich habe Sie am Tag des Berufs kennengelernt.</p>

<div style="display:flex; gap:10px; align-items:center;">

<div class="avatar">
<img id="previewPhoto">
</div>

<div>
<div class="name" id="v_name">—</div>
<div class="meta" id="v_meta">—</div>
</div>

</div>

<div>
<span class="chip" id="v_interest">—</span>
<span class="chip" id="v_time">—</span>
<span class="chip" id="v_career">—</span>
</div>

<div class="meta" id="v_contact">—</div>

</div>

</div>
</div>

<script>
function val(id){
  let v=document.getElementById(id).value;
  return v ? v : "—";
}

function update(){
  document.getElementById("v_name").innerText = val("name");

  document.getElementById("v_meta").innerHTML =
    "Schule: "+val("school")+"<br>" +
    "Abschluss: "+val("abschluss")+"<br>" +
    "Wann: "+val("abschlussWann");

  document.getElementById("v_interest").innerText = val("interest");
  document.getElementById("v_time").innerText = val("timeframe");
  document.getElementById("v_career").innerText = val("career");

  document.getElementById("v_contact").innerText =
    "Kontakt: "+val("contact");
}

document.querySelectorAll("input, select").forEach(e=>{
  e.addEventListener("input", update);
});

document.getElementById("photo").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(event){
    const img = document.getElementById("previewPhoto");
    img.src = event.target.result;
    img.style.display = "block";
  };
  reader.readAsDataURL(file);
});

async function saveCard(){
  const card = document.getElementById("card");

  const canvas = await html2canvas(card, {
    scale: 2
  });

  canvas.toBlob(async function(blob){

    const file = new File([blob], "bewerbung.png", {type: "image/png"});

    if(navigator.share){
      try{
        await navigator.share({
          files: [file],
          title: "Kurzbewerbung"
        });
        return;
      }catch(e){}
    }

    const link = document.createElement("a");
    link.download = "bewerbung.png";
    link.href = canvas.toDataURL();
    link.click();

  });
}

update();
</script>

</body>
</html>
