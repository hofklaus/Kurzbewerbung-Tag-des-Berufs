<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurzbewerbung – Tag des Berufs</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  padding: 16px;
}

.wrap {
  max-width: 1000px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #332f87;
}

.grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 16px;
}

.panel, .preview {
  background: white;
  border-radius: 20px;
  padding: 16px;
  border: 1px solid #ddd;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #332f87;
  color: white;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
}

/* 🔥 LOGO BEREICH */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.brand-logo {
  width: 40px;
  height: 40px;
  object-fit: contain;
  border-radius: 50%;
}

.brand-text {
  font-size: 12px;
  font-weight: bold;
  color: #667085;
}

/* KARTE */
.name {
  font-size: 24px;
  color: #332f87;
  font-weight: bold;
}

.meta {
  color: #555;
  margin-top: 5px;
}

.chip {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: #eef2f8;
  margin: 5px 5px 0 0;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="wrap">
<h1>Kurzbewerbung – Tag des Berufs</h1>

<div class="grid">

<!-- FORMULAR -->
<div class="panel">

<label>Dein Name</label>
<input id="name">

<label>Deine Schule</label>
<select id="school">
<option value="">Bitte auswählen</option>
<option>Friedrich-List-Schule</option>
<option>Emil-Possehl-Schule</option>
</select>

<label>Dein Abschluss (voraussichtlich)</label>
<input id="abschluss">

<label>Kontakt</label>
<input id="contact">

<label>Ich suche</label>
<select id="interest">
<option value="">Bitte auswählen</option>
<option>Praktikum</option>
<option>Ausbildung</option>
<option>Duales Studium</option>
</select>

<label>Ab wann / Zeitraum</label>
<input id="time">

<label>Beruf oder Bereich</label>
<input id="career">

<button onclick="download()">Karte herunterladen</button>

</div>

<!-- VORSCHAU -->
<div class="preview">

<div class="brand">
<img src="logo.png" class="brand-logo">
<div class="brand-text">Tag des Berufs</div>
</div>

<div id="intro">
Hallo, ich habe Sie am Tag des Berufs kennengelernt.
</div>

<div class="name" id="v_name">—</div>

<div class="meta" id="v_meta">—</div>

<div>
<span class="chip" id="v_interest">—</span>
<span class="chip" id="v_time">—</span>
<span class="chip" id="v_career">—</span>
</div>

</div>

</div>
</div>

<canvas id="canvas" width="1200" height="700" style="display:none;"></canvas>

<script>
function val(id){
  let v=document.getElementById(id).value;
  return v ? v : "—";
}

function update(){
  document.getElementById("v_name").innerText = val("name");
  document.getElementById("v_meta").innerText =
    val("school")+" · "+val("abschluss")+" · "+val("contact");
  document.getElementById("v_interest").innerText = val("interest");
  document.getElementById("v_time").innerText = val("time");
  document.getElementById("v_career").innerText = val("career");
}

document.querySelectorAll("input, select").forEach(e=>{
  e.addEventListener("input", update);
});

function download(){
  const c = document.getElementById("canvas");
  const ctx = c.getContext("2d");

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,1200,700);

  ctx.fillStyle="#000";
  ctx.font="30px Arial";
  ctx.fillText(val("name"),50,100);

  ctx.font="20px Arial";
  ctx.fillText(val("school")+" "+val("abschluss"),50,140);
  ctx.fillText(val("contact"),50,180);

  ctx.fillText(val("interest")+" | "+val("time")+" | "+val("career"),50,230);

  const a=document.createElement("a");
  a.download="bewerbung.png";
  a.href=c.toDataURL();
  a.click();
}
</script>

</body>
</html>
